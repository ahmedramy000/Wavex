<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280">
  <defs>
    <linearGradient id="ttbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0420"/>
      <stop offset="60%" stop-color="#14062e"/>
      <stop offset="100%" stop-color="#080418"/>
    </linearGradient>
    <linearGradient id="ttg1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="ttg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="ttglow" x="-5%" y="-50%" width="110%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tttextglow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="280" fill="url(#ttbg)"/>

  <!-- Orbs -->
  <circle cx="200" cy="100" r="150" fill="#a78bfa" opacity="0.04"/>
  <circle cx="700" cy="180" r="130" fill="#f472b6" opacity="0.04"/>

  <!-- Stars scattered -->
  <g opacity="0.5" filter="url(#ttglow)">
    <circle cx="80"  cy="55"  r="2" fill="#a78bfa"/>
    <circle cx="200" cy="35"  r="1.5" fill="#f472b6"/>
    <circle cx="820" cy="50"  r="2" fill="#a78bfa"/>
    <circle cx="700" cy="30"  r="1.5" fill="#f472b6"/>
    <circle cx="450" cy="20"  r="1" fill="white"/>
    <circle cx="140" cy="230" r="1.5" fill="#fb923c"/>
    <circle cx="760" cy="240" r="1.5" fill="#a78bfa"/>
  </g>

  <!-- Diagonal accent lines -->
  <line x1="0" y1="280" x2="280" y2="0"   stroke="url(#ttg1)" stroke-width="0.6" opacity="0.1"/>
  <line x1="900" y1="280" x2="620" y2="0" stroke="url(#ttg2)" stroke-width="0.6" opacity="0.1"/>

  <!-- Text -->
  <text x="450" y="112" font-family="Arial Black,Impact,sans-serif"
        font-size="78" font-weight="900" fill="white"
        text-anchor="middle" opacity="0.97" filter="url(#tttextglow)">Wavex</text>

  <text x="450" y="148" font-family="Arial,sans-serif"
        font-size="15" fill="url(#ttg1)"
        text-anchor="middle" letter-spacing="8" opacity="0.9">TEAM</text>

  <text x="450" y="170" font-family="Arial,sans-serif"
        font-size="12" fill="white"
        text-anchor="middle" letter-spacing="2" opacity="0.35">Building the future of social</text>

  <rect x="380" y="182" width="140" height="1" rx="1" fill="url(#ttg1)" opacity="0.3"/>
</svg>
