<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#0f1a4a"/>
      <stop offset="100%" stop-color="#050818"/>
    </radialGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7f7"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6ee7f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- Gradient ring -->
  <circle cx="100" cy="100" r="93" fill="none" stroke="url(#g1)" stroke-width="2.5" opacity="0.6"/>

  <!-- 3 wave lines — centered vertically -->
  <path d="M28 88 Q52 68 76 88 Q100 108 124 88 Q148 68 172 88"
        fill="none" stroke="url(#g1)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M28 103 Q52 83 76 103 Q100 123 124 103 Q148 83 172 103"
        fill="none" stroke="url(#g2)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M28 118 Q52 98 76 118 Q100 138 124 118 Q148 98 172 118"
        fill="none" stroke="url(#g1)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Verified badge bottom-right -->
  <circle cx="145" cy="148" r="22" fill="#050818"/>
  <circle cx="145" cy="148" r="19" fill="url(#g1)"/>
  <text x="145" y="155" font-family="Arial,sans-serif" font-size="18"
        fill="white" text-anchor="middle" font-weight="900">✓</text>
</svg>
