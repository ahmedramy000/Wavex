<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#0f1a4a"/>
      <stop offset="100%" stop-color="#050818"/>
    </radialGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7f7"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="url(#g1)" stroke-width="6" opacity="0.5"/>
  <!-- Waves -->
  <path d="M72 224 Q128 176 184 224 Q240 272 296 224 Q352 176 408 224 Q440 248 440 248"
        fill="none" stroke="url(#g1)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M72 270 Q128 222 184 270 Q240 318 296 270 Q352 222 408 270 Q440 294 440 294"
        fill="none" stroke="url(#g1)" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <path d="M72 316 Q128 268 184 316 Q240 364 296 316 Q352 268 408 316 Q440 340 440 340"
        fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round" opacity="0.3"/>
  <!-- W lettermark -->
  <text x="256" y="175" font-family="Arial Black,sans-serif" font-size="120" font-weight="900"
        fill="white" text-anchor="middle" opacity="0.95" filter="url(#glow)">W</text>
  <!-- Verified badge -->
  <circle cx="380" cy="155" r="52" fill="#050818"/>
  <circle cx="380" cy="155" r="46" fill="url(#g1)"/>
  <text x="380" y="172" font-family="Arial,sans-serif" font-size="42"
        fill="white" text-anchor="middle" font-weight="900">✓</text>
</svg>
