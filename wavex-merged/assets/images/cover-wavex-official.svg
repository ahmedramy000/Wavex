<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280">
  <defs>
    <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04061a"/>
      <stop offset="60%" stop-color="#080d28"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="cg1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7f7"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6ee7f7"/>
    </linearGradient>
    <filter id="cglow" x="-5%" y="-50%" width="110%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textglow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="280" fill="url(#cbg)"/>

  <!-- Soft orbs -->
  <circle cx="160" cy="140" r="160" fill="#6ee7f7" opacity="0.035"/>
  <circle cx="740" cy="140" r="140" fill="#a78bfa" opacity="0.04"/>

  <!-- Wave 1 — main glowing -->
  <path d="M0 155 Q112 125 225 155 Q337 185 450 155 Q562 125 675 155 Q787 185 900 155"
        fill="none" stroke="url(#cg1)" stroke-width="3.5"
        stroke-linecap="round" filter="url(#cglow)" opacity="0.9"/>
  <!-- Wave 2 -->
  <path d="M0 172 Q112 142 225 172 Q337 202 450 172 Q562 142 675 172 Q787 202 900 172"
        fill="none" stroke="url(#cg2)" stroke-width="2"
        stroke-linecap="round" opacity="0.5"/>
  <!-- Wave 3 -->
  <path d="M0 138 Q112 108 225 138 Q337 168 450 138 Q562 108 675 138 Q787 168 900 138"
        fill="none" stroke="url(#cg1)" stroke-width="1.5"
        stroke-linecap="round" opacity="0.25"/>

  <!-- Logo wordmark -->
  <text x="450" y="112" font-family="Arial Black,Impact,sans-serif"
        font-size="78" font-weight="900" fill="white"
        text-anchor="middle" opacity="0.97" filter="url(#textglow)">Wavex</text>

  <!-- Subtitle -->
  <text x="450" y="148" font-family="Arial,sans-serif"
        font-size="15" fill="url(#cg1)"
        text-anchor="middle" letter-spacing="5" opacity="0.85">OFFICIAL ACCOUNT</text>

  <!-- Thin divider line -->
  <rect x="350" y="162" width="200" height="1.5" rx="1" fill="url(#cg1)" opacity="0.35"/>
</svg>
