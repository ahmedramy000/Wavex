<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="tbg" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#200a3a"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </radialGradient>
    <linearGradient id="tg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="tg2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="tglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#tbg)"/>

  <!-- Ring -->
  <circle cx="100" cy="100" r="93" fill="none" stroke="url(#tg1)" stroke-width="2.5" opacity="0.55"/>

  <!-- 6-point star — perfectly centered -->
  <polygon points="100,42 112,78 150,78 120,100 132,136 100,114 68,136 80,100 50,78 88,78"
           fill="url(#tg1)" filter="url(#tglow)" opacity="0.95"/>
  <!-- Inner star highlight -->
  <polygon points="100,58 108,78 130,78 114,90 120,110 100,98 80,110 86,90 70,78 92,78"
           fill="white" opacity="0.12"/>

  <!-- Verified badge -->
  <circle cx="145" cy="148" r="22" fill="#0a0518"/>
  <circle cx="145" cy="148" r="19" fill="url(#tg1)"/>
  <text x="145" y="155" font-family="Arial,sans-serif" font-size="18"
        fill="white" text-anchor="middle" font-weight="900">✓</text>
</svg>
